name: pre-commit

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: no-commit-to-branch
