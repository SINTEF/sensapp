name: Python SDK Check

on:
  push:
    branches: [main, develop]
    paths:
      - "python/sensapp/**"
      - ".github/workflows/python-sdk-check.yaml"
      - "docs/PYTHON_SDK.md"
  pull_request:
    paths:
      - "python/sensapp/**"
      - ".github/workflows/python-sdk-check.yaml"
      - "docs/PYTHON_SDK.md"

jobs:
  python-sdk-unit:
    name: Python SDK Unit (3.14)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/sensapp
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install SDK dependencies
        run: uv pip install --system -e '.[dev]'

      - name: Run Ruff check
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      - name: Run unit tests
        run: python -m pytest -m 'not integration'

      - name: Build distributions
        run: uv build

      - name: Smoke test wheel install
        run: |
          python -m venv /tmp/sensapp-wheel
          /tmp/sensapp-wheel/bin/python -m pip install dist/*.whl
          /tmp/sensapp-wheel/bin/python -c "import sensapp; print(sensapp.__all__[0])"

  python-sdk-integration:
    name: Python SDK Integration
    runs-on: ubuntu-latest
    needs: python-sdk-unit
    defaults:
      run:
        working-directory: python/sensapp
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Rust toolchain
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable

      - name: Install SDK dependencies
        run: uv pip install --system -e '.[dev]'

      - name: Build SensApp with SQLite
        run: cargo build --locked --no-default-features --features sqlite
        working-directory: .

      - name: Start live SensApp server
        run: |
          SENSAPP_STORAGE_CONNECTION_STRING=sqlite:///tmp/sensapp-sdk-ci.db \
            ./target/debug/sensapp > /tmp/sensapp-sdk-ci.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sensapp-sdk-ci.log
          exit 1
        working-directory: .

      - name: Run live integration tests
        run: python -m pytest -m integration
        env:
          SENSAPP_LIVE_REQUIRED: '1'
