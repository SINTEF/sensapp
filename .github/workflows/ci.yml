name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DUCKDB_DOWNLOAD_LIB: "1"
  DUCKDB_CMAKE_BUILD_TYPE: Release
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          components: rustfmt, clippy

      - name: Cache cargo-make
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-make
          key: cargo-make-${{ runner.os }}

      - name: Install cargo-make
        run: |
          if ! command -v cargo-make &> /dev/null; then
            cargo install cargo-make
          fi

      - name: Format check
        run: cargo make fmt-check

      - name: Verify release tag and chart version
        if: github.event_name == 'release'
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          chart = pathlib.Path('charts/sensapp/Chart.yaml').read_text()
          app_version = next(line.split(':', 1)[1].strip().strip('"') for line in chart.splitlines() if line.startswith('appVersion:'))
          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{version}' or app_version != version:
              raise SystemExit(f'Tag {tag}, crate {version}, and chart appVersion {app_version} must match')
          PY

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable

      - name: Cache cargo-make
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-make
          key: cargo-make-${{ runner.os }}

      - name: Install cargo-make
        run: |
          if ! command -v cargo-make &> /dev/null; then
            cargo install cargo-make
          fi

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        run: cargo make security-audit

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies for high advisories
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  python-sdk:
    name: Python SDK Unit and Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/sensapp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install SDK dependencies
        run: uv pip install --system -e '.[dev]'
      - name: Check, test, and package SDK
        run: |
          uv run ruff check .
          uv run ruff format --check .
          python -m pytest -m 'not integration'
          uv build

  test-matrix:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    needs: quality-checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: [stable]
        #rust: [stable, beta]
        feature: [sqlite, postgres, clickhouse, duckdb, timescaledb, rrdcached]
        include:
          - feature: sqlite
            test-env: "TEST_DATABASE_URL_SQLITE=sqlite://test.db"
          - feature: postgres
            test-env: "TEST_DATABASE_URL_POSTGRES=postgres://postgres:postgres@localhost:5432/sensapp-test"
          - feature: clickhouse
            test-env: "TEST_DATABASE_URL_CLICKHOUSE=clickhouse://default:password@localhost:8123/sensapp_test"
          - feature: duckdb
            test-env: "TEST_DATABASE_URL_DUCKDB=duckdb://test.duckdb"
          - feature: timescaledb
            test-env: "TEST_DATABASE_URL_TIMESCALEDB=timescaledb://postgres:postgres@localhost:5433/sensapp-test"
          - feature: rrdcached
            test-env: "TEST_DATABASE_URL_RRDCACHED=rrdcached://127.0.0.1:42217?preset=hoarder"

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: sensapp-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_DB: sensapp_test
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: password
        options: >-
          --health-cmd "clickhouse-client --password password --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 8123:8123
          - 9000:9000
      timescaledb:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: sensapp-test
        options: >-
          --health-cmd "pg_isready -U postgres -d sensapp-test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5433:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: moonrepo/setup-rust@v1
        with:
          channel: ${{ matrix.rust }}
          components: clippy

      - name: Cache cargo-make
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-make
          key: cargo-make-${{ runner.os }}

      - name: Install cargo-make
        run: |
          if ! command -v cargo-make &> /dev/null; then
            cargo install cargo-make
          fi

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,sqlite

      - name: Start RRDCached test service
        if: matrix.feature == 'rrdcached'
        run: |
          docker build -f docker/rrdcached/Dockerfile -t sensapp-rrdcached-test .
          docker run -d --name sensapp-rrdcached -p 42217:42217 sensapp-rrdcached-test

          for attempt in $(seq 1 30); do
            if nc -z 127.0.0.1 42217; then
              exit 0
            fi

            sleep 1
          done

          docker logs sensapp-rrdcached
          exit 1

      - name: Set up test environment
        run: |
          ${{ matrix.test-env }}
          echo "${{ matrix.test-env }}" >> $GITHUB_ENV

      - name: Run migrations (PostgreSQL)
        if: matrix.feature == 'postgres'
        run: cargo make migrate-postgres

      - name: Run migrations (SQLite)
        if: matrix.feature == 'sqlite'
        run: cargo make migrate-sqlite

      - name: Run migrations (TimescaleDB)
        if: matrix.feature == 'timescaledb'
        run: cargo make migrate-timescaledb

      - name: Run tests
        if: matrix.feature != 'rrdcached'
        run: cargo make check-${{ matrix.feature }}

      - name: Run RRDCached checks
        if: matrix.feature == 'rrdcached'
        run: |
          export TEST_DATABASE_URL='rrdcached://127.0.0.1:42217?preset=hoarder'
          cargo build --features rrdcached --no-default-features
          cargo test --features rrdcached --no-default-features storage::rrdcached --lib
          cargo test --features rrdcached --no-default-features http::influxdb::tests::test_publish_influxdb -- --exact
          cargo test --features rrdcached --no-default-features http::influxdb::tests::test_publish_influxdb_with_numeric_enabled -- --exact
          cargo test --features rrdcached --no-default-features --test rrdcached_integration

  helm-validation:
    name: Helm Validation
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint charts/sensapp

      - name: Render chart with SQLite defaults
        run: helm template sensapp charts/sensapp

      - name: Render chart with PostgreSQL override
        run: >-
          helm template sensapp charts/sensapp
          --set storage.connectionString=postgres://postgres:postgres@postgres:5432/sensapp
          --set persistence.enabled=false

  docker-smoke:
    name: Docker Smoke Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: quality-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime
            features: postgres,sqlite,timescaledb,duckdb,clickhouse,rrdcached

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_DB: sensapp_test
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: password
        options: >-
          --health-cmd "clickhouse-client --password password --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 8123:8123

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image variant
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: ${{ matrix.name == 'runtime' }}
          tags: sensapp-ci:${{ matrix.name }}
          platforms: linux/amd64
          build-args: |
            FEATURES=${{ matrix.features }}
            NO_DEFAULT_FEATURES=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start runtime image against ClickHouse
        if: matrix.name == 'runtime'
        run: >-
          docker run --detach --name sensapp-ci-runtime --network host
          --env SENSAPP_STORAGE_CONNECTION_STRING=clickhouse://default:password@127.0.0.1:8123/sensapp_test
          sensapp-ci:runtime

      - name: Smoke test publish, query, and metrics
        if: matrix.name == 'runtime'
        run: python3 tests/clickhouse_container_smoke.py

      - name: Set up Python for live SDK checks
        if: matrix.name == 'runtime'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv for live SDK checks
        if: matrix.name == 'runtime'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Test Python SDK against runtime image
        if: matrix.name == 'runtime'
        working-directory: python/sensapp
        env:
          SENSAPP_LIVE_REQUIRED: '1'
        run: |
          uv pip install --system -e '.[dev]'
          python -m pytest -m integration

      - name: Verify readiness during ClickHouse outage and recovery
        if: matrix.name == 'runtime'
        run: |
          docker stop '${{ job.services.clickhouse.id }}'
          python3 tests/clickhouse_container_smoke.py --mode unready
          docker start '${{ job.services.clickhouse.id }}'
          python3 tests/clickhouse_container_smoke.py --mode ready

      - name: Show runtime logs on failure
        if: failure() && matrix.name == 'runtime'
        run: docker logs sensapp-ci-runtime

      - name: Stop runtime image
        if: always() && matrix.name == 'runtime'
        run: docker rm --force sensapp-ci-runtime || true

  docker-bigquery-compile:
    name: Experimental BigQuery Image Compile
    runs-on: ubuntu-latest
    needs: quality-checks
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: |
            FEATURES=postgres,sqlite,timescaledb,duckdb,clickhouse,rrdcached,bigquery
            NO_DEFAULT_FEATURES=true
          cache-from: type=gha,scope=runtime-bigquery
          cache-to: type=gha,scope=runtime-bigquery,mode=max

