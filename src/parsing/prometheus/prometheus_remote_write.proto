// https://prometheus.io/docs/concepts/remote_write_spec/
// Version: 1.0
// Status: Published
// Date: April 2023

syntax = "proto3";

message WriteRequest {
  repeated TimeSeries timeseries = 1;
  // Cortex uses this field to determine the source of the write request.
  // We reserve it to avoid any compatibility issues.
  reserved  2;

  // Prometheus uses this field to send metadata, but this is
  // omitted from v1 of the spec as it is experimental.
  // SensApp does not store it: it reads the field as bytes, only to count it.
  repeated bytes metadata = 3;
}

message TimeSeries {
  repeated Label labels   = 1;
  repeated Sample samples = 2;
  // Exemplars and native histograms, which SensApp does not store: read as bytes, only to
  // count them.
  repeated bytes exemplars  = 3;
  repeated bytes histograms = 4;
}

message Label {
  string name  = 1;
  string value = 2;
}

message Sample {
  double value    = 1;
  int64 timestamp = 2;
}
