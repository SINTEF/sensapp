replicaCount: 1

image:
  repository: ghcr.io/sintef/sensapp
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sensapp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  # Only needed for a durable local SQLite database.
  enabled: false
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  storageClassName: ""

env:
  SENSAPP_ENDPOINT: 0.0.0.0
  SENSAPP_PORT: "3000"
  SENSAPP_HTTP_BODY_LIMIT: 64MiB
  SENSAPP_HTTP_SERVER_TIMEOUT_SECONDS: "30"
  SENSAPP_HTTP_MAX_CONCURRENT_WRITES: "16"
  SENSAPP_BATCH_SIZE: "8192"
  # Do not write samples that are stored already; PostgreSQL, TimescaleDB, SQLite and DuckDB only,
  # the server refuses to start on another backend. See docs/DATA_LIFECYCLE.md#duplicate-samples
  SENSAPP_DEDUPLICATE_ON_INGEST: "false"
  SENSAPP_INFLUXDB_WITH_NUMERIC: "false"

storage:
  # One storage backend per release. SQLite uses the pod's data volume.
  # For external storage, set this to its URL or use an existing Secret below.
  connectionString: sqlite:///var/lib/sensapp/sensapp.db
  # The Secret must contain SENSAPP_STORAGE_CONNECTION_STRING (or existingSecretKey).
  # When set, it takes precedence over connectionString.
  existingSecret: ""
  existingSecretKey: SENSAPP_STORAGE_CONNECTION_STRING

# Optional JWT authentication.
# When jwtSecret is set, read/write endpoints require a valid Bearer token.
# Health checks, docs, and prometheus scrape remain open.
# Use `sensapp generate-token <subject>` to create tokens.
auth:
  # Set to a random string of at least 32 characters to enable JWT auth.
  # Leave empty (or omit) to run without authentication (default).
  jwtSecret: ""

secretEnv: {}
extraEnv: []
extraEnvFrom: []

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

startupProbe:
  httpGet:
    path: /health/live
    port: http
  failureThreshold: 30
  periodSeconds: 5
