replicaCount: 1

image:
  repository: ghcr.io/sintef/sensapp
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sensapp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  # Only needed for a durable local SQLite database.
  enabled: false
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  storageClassName: ""

env:
  SENSAPP_ENDPOINT: 0.0.0.0
  SENSAPP_PORT: "3000"
  SENSAPP_HTTP_BODY_LIMIT: 64MiB
  SENSAPP_HTTP_SERVER_TIMEOUT_SECONDS: "30"
  SENSAPP_HTTP_MAX_CONCURRENT_WRITES: "16"
  SENSAPP_BATCH_SIZE: "8192"
  # Do not write samples that are stored already; PostgreSQL, TimescaleDB, SQLite and DuckDB only,
  # the server refuses to start on another backend. See docs/DATA_LIFECYCLE.md#duplicate-samples
  SENSAPP_DEDUPLICATE_ON_INGEST: "false"
  SENSAPP_INFLUXDB_WITH_NUMERIC: "false"

storage:
  # One storage backend per release. SQLite uses the pod's data volume.
  # For external storage, set this to its URL or use an existing Secret below.
  connectionString: sqlite:///var/lib/sensapp/sensapp.db
  # The Secret must contain SENSAPP_STORAGE_CONNECTION_STRING (or existingSecretKey).
  # When set, it takes precedence over connectionString.
  existingSecret: ""
  existingSecretKey: SENSAPP_STORAGE_CONNECTION_STRING

# Authentication. SensApp does not run open unless told to: the protected endpoints need a JWT
# signed with a secret. Health checks, docs, the UI files and the Prometheus scrape stay open.
#
# By default the chart makes a random secret on the first install and keeps it across upgrades
# (it is read back from the Secret of the release). Make an admin token with:
#   kubectl exec deploy/<release name> -- sensapp generate-token me --scope read,admin
# Tools that only render the chart (Argo CD, `helm template`) cannot read it back and would make a
# new secret each time: for those, give jwtSecret or existingSecret.
auth:
  # A secret of at least 32 characters (`sensapp generate-secret` makes one). Stored in the Secret
  # of the release, and in the release values: prefer existingSecret.
  jwtSecret: ""
  # A Secret of yours holding the key below. Takes precedence over jwtSecret.
  existingSecret: ""
  existingSecretKey: SENSAPP_JWT_SECRET
  # Secrets that still verify tokens but never sign them, separated by commas: the way to rotate
  # the secret. Dropping one revokes the tokens it signed.
  previousSecrets: ""
  # Run with every endpoint open (SENSAPP_AUTH_DISABLED). For a network that authenticates
  # in front of SensApp. Ignored when a secret is given.
  disabled: false

secretEnv: {}
extraEnv: []
extraEnvFrom: []

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

startupProbe:
  httpGet:
    path: /health/live
    port: http
  failureThreshold: 30
  periodSeconds: 5
