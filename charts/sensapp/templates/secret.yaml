{{- if include "sensapp.hasSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sensapp.fullname" . }}
  labels:
    {{- include "sensapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.storage.existingSecret }}
  SENSAPP_STORAGE_CONNECTION_STRING: {{ .Values.storage.connectionString | quote }}
  {{- end }}
  {{- if .Values.auth.jwtSecret }}
  SENSAPP_JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  {{- else if include "sensapp.generateJwtSecret" . }}
  SENSAPP_JWT_SECRET: {{ include "sensapp.jwtSecret" . | quote }}
  {{- end }}
  {{- if .Values.auth.previousSecrets }}
  SENSAPP_JWT_PREVIOUS_SECRETS: {{ .Values.auth.previousSecrets | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
