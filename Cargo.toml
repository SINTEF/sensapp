[package]
name = "sensapp"
version = "0.4.1"
edition = "2024"
description = "Sensor data ingestion, storage, and retrieval platform"
license = "Apache-2.0"
repository = "https://github.com/SINTEF/sensapp"
homepage = "https://github.com/SINTEF/sensapp"
readme = "README.md"

[features]
default = ["postgres", "sqlite"]
# Storage backends
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite", "sqlx/regexp"]
timescaledb = ["sqlx/postgres"] # Uses same driver as postgres
duckdb = ["dep:duckdb"]
bigquery = ["dep:gcp-bigquery-client"]
rrdcached = ["dep:rrdcached-client"]
clickhouse = ["dep:clickhouse"]
# Convenience feature to enable all storage backends
all-storage = [
  "postgres",
  "sqlite",
  "timescaledb",
  "duckdb",
  "bigquery",
  "rrdcached",
  "clickhouse",
]
# Test utilities
test-utils = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arrow = { version = "60", features = ["ipc", "ipc_compression"] }
arrow-ipc = { version = "60", features = ["lz4"] }
arrow-schema = "60"
arrow-array = "60"
anyhow = "1.0"
async-trait = "0.1"
thiserror = "2.0"
sha2 = "0.10"
axum = { version = "0.8", features = ["multipart", "macros"] }
base64 = "0.22"
futures = "0.3"
sqlx = { version = "0.9", features = [
  "runtime-tokio",
  "uuid",
  "json",
  "time",
  "rust_decimal",
] }
tokio = { version = "1.48", features = ["full"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.18", features = ["serde"] }
fastrand = "2"
getrandom = "0.3"
csv-async = "1.3"
rust_decimal = "1.39"
geo = "0.32"
cached = { version = "4", features = ["async"] }
nom = "8.0"
sindit-senml = "0.3"
serde_json = "1.0"
hifitime = "4.2"
iso8601 = "0.6"
# No "bundled" feature: it compiles DuckDB from C++ source (~20 min) and disables
# DUCKDB_DOWNLOAD_LIB. Without it, libduckdb-sys downloads the prebuilt library
# (see .cargo/config.toml and the Dockerfile, which ships libduckdb.so).
duckdb = { version = "1.3", optional = true }
serde = "1.0"
confique = { version = "0.4", features = ["toml"] }
byte-unit = "5.1"
prost = "0.14"
snap = "1.1"
rusty-chunkenc = "0.1"
blake3 = "1.8"
regex = "1.12"
influxdb-line-protocol = "2.0"
flate2 = "1.1.4"
smallvec = "1.15"
once_cell = "1.21.4"
urlencoding = "2.1"
hybridmap = "0.1.3"
sentry = { version = "0.47", features = ["anyhow", "tower"] }
url = "2.5"
gcp-bigquery-client = { version = "0.28", optional = true }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-scalar = { version = "0.4", features = ["axum"] }
rrdcached-client = { version = "0.4", optional = true }
clickhouse = { version = "0.15", features = [
  "lz4",
  "uuid",
  "time",
  "inserter",
  # TLS with the system trust store (it honours SSL_CERT_FILE and SSL_CERT_DIR), so that a
  # ClickHouse behind a private CA can be reached. The bundled Mozilla roots of the
  # `rustls-tls` feature cannot be extended.
  "rustls-tls-aws-lc",
  "rustls-tls-native-roots",
], optional = true }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
rustls = "0.23"
rusty-promql-parser = "0.2.1"
prometheus-client = "0.24"
simplify-polyline = "0.5"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
temp-env = "0.3"
tokio-test = "0.4"
serial_test = "3.1"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
# Re-import the same crate with test-utils feature for integration tests
sensapp = { path = ".", features = ["test-utils"], default-features = false }

# Smaller debug artifacts: faster links and much smaller CI caches.
[profile.dev]
debug = "line-tables-only"
