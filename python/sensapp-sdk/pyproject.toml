[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "sensapp-sdk"
version = "0.1.0"
description = "Python SDK for the SensApp HTTP API with Arrow-first helpers"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
  { name = "SINTEF" }
]
keywords = ["sensapp", "timeseries", "sensors", "arrow", "pyarrow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "httpx>=0.28.1,<1",
  "pyarrow>=23.0.1,<24",
]

[project.optional-dependencies]
dev = [
  "build>=1.4.0,<2",
  "pytest>=9.0.2,<10",
  "ruff>=0.15.6,<0.16",
]

[project.urls]
Homepage = "https://github.com/SINTEF/sensapp"
Repository = "https://github.com/SINTEF/sensapp"
Documentation = "https://github.com/SINTEF/sensapp/tree/main/python/sensapp-sdk"
Issues = "https://github.com/SINTEF/sensapp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sensapp_sdk"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that talk to a live SensApp server",
]
