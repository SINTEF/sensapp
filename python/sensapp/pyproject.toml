[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "sensapp"
version = "0.1.0"
description = "Async Python client for the SensApp HTTP API — Arrow-first data exchange"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "SINTEF" }
]
keywords = ["sensapp", "timeseries", "sensors", "arrow", "pyarrow", "async"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "niquests>=3,<4",
  "polars>=1,<2",
  "pyarrow>=18,<25",
]

[project.optional-dependencies]
pandas = [
  "pandas>=2.2,<3",
]
dev = [
  "pandas>=2.2,<3",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://github.com/SINTEF/sensapp"
Repository = "https://github.com/SINTEF/sensapp"
Documentation = "https://github.com/SINTEF/sensapp/tree/main/python/sensapp"
Issues = "https://github.com/SINTEF/sensapp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sensapp"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: tests that require a live SensApp server",
]
