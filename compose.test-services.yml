services:
  postgres:
    image: postgres:18
    container_name: sensapp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sensapp-test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sensapp-test"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: sensapp-timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sensapp-test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sensapp-test"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - timescaledb-test-data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: sensapp-clickhouse
    environment:
      CLICKHOUSE_DB: sensapp_test
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password password --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - clickhouse-test-data:/var/lib/clickhouse

  rrdcached:
    build:
      context: .
      dockerfile: docker/rrdcached/Dockerfile
    container_name: sensapp-rrdcached
    ports:
      - "42217:42217"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "42217"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rrdcached-test-data:/var/lib/rrdcached

volumes:
  postgres-test-data:
  timescaledb-test-data:
  clickhouse-test-data:
  rrdcached-test-data:
